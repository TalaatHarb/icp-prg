name: build-refactoring-sample
on:
  push:
    branches:
    - '**'
    paths:
      - refactoring-sample/**
      - .github/workflows/build-refactoring-sample.yml

jobs:
  build-project:
    name: build-refactoring-sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: cd refactoring-sample && mvn clean compile org.pitest:pitest-maven:mutationCoverage verify package -DnvdApiKey=${{ secrets.NVD_API_KEY }}
